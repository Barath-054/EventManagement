[project]
name = "eventmate-ai"
version = "2.0.0"
description = "EVENTMATE AI – Smart Event Planning and Budget Management Platform for Coimbatore, Tamil Nadu"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "python-jose>=3.3.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
